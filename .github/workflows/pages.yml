# Publishes the JISER interface on GitHub Pages (https://eyaazzabi.github.io/Jiser/) at every push.
# The interface is static; it calls the API hosted on Render (repository variable JISER_API_URL).
# Requires Settings > Pages > Source: GitHub Actions (enabled).
name: Interface sur GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", "docs/videos/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          JISER_BASE: /Jiser/
          VITE_API_URL: ${{ vars.JISER_API_URL || 'https://jiser-api.onrender.com' }}
      # deep links (/Jiser/entreprise…) are served the app itself, which then routes on the client
      - run: cp frontend/dist/index.html frontend/dist/404.html
      # demo videos, played straight in the browser from the README (https://eyaazzabi.github.io/Jiser/videos/…)
      - run: mkdir -p frontend/dist/videos && cp docs/videos/*.mp4 docs/videos/*.jpg docs/videos/index.html frontend/dist/videos/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
